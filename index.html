<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vehicles Contract 2.0</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* মূল ওভারফ্লো এবং বডি ফিক্স */
        html, body {
            max-width: 100%;
            overflow-x: hidden;
            background-color: #f8fafc;
        }
        
        /* লম্বা টেক্সট স্ক্রিনের বাইরে যাওয়া ঠেকাতে */
        p, span, h1, h2, h3, h4, h5, td, div {
            overflow-wrap: break-word;
            word-break: break-word;
        }

        /* মোবাইলে টেবিল সুন্দরভাবে স্ক্রল করার জন্য কাস্টম স্ক্রলবার */
        .table-container::-webkit-scrollbar {
            height: 6px;
        }
        .table-container::-webkit-scrollbar-thumb {
            background-color: #cbd5e1;
            border-radius: 10px;
        }
    </style>
</head>
<body class="text-slate-800">

    <!-- Header -->
    <header class="bg-indigo-600 text-white p-4 shadow-md">
        <div class="container mx-auto flex justify-between items-center w-full px-2">
            <h1 class="text-lg md:text-xl font-bold flex items-center gap-2">
                <i class="fa-solid fa-truck"></i> Vehicles Contract 2.0
            </h1>
            <button onclick="adminLogin()" class="bg-indigo-800 hover:bg-indigo-900 px-3 py-1.5 md:px-4 md:py-2 rounded text-xs md:text-sm font-bold transition shadow-sm">
                Admin Panel
            </button>
        </div>
    </header>

    <!-- Main Content -->
    <main class="container mx-auto p-4 mt-4 w-full">
        
        <!-- Search Bar -->
        <div class="mb-6 flex flex-col md:flex-row justify-between items-center gap-4">
            <div class="relative w-full md:w-1/2">
                <i class="fa-solid fa-search absolute left-3 top-3 text-gray-400"></i>
                <input type="text" id="searchInput" placeholder="Search by name, phone or vehicle..." class="w-full pl-10 pr-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none shadow-sm text-sm">
            </div>
            <button class="w-full md:w-auto bg-blue-600 hover:bg-blue-700 text-white px-5 py-2 rounded-lg font-bold text-sm shadow-md transition">
                <i class="fa-solid fa-plus mr-1"></i> Add Contract
            </button>
        </div>

        <!-- Responsive Table Container -->
        <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden w-full">
            <!-- overflow-x-auto ক্লাসটি মোবাইলে টেবিলকে ডানে-বামে সুন্দর করে স্ক্রল করতে সাহায্য করবে -->
            <div class="overflow-x-auto w-full table-container">
                <table class="w-full min-w-[800px] text-left border-collapse">
                    <thead class="bg-slate-100 text-slate-600 text-xs uppercase tracking-wide">
                        <tr>
                            <th class="p-4 font-bold">Driver Name</th>
                            <th class="p-4 font-bold">Category</th>
                            <th class="p-4 font-bold">Contact</th>
                            <th class="p-4 font-bold">Vehicle Info</th>
                            <th class="p-4 font-bold">Status</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody" class="divide-y divide-gray-100 text-sm">
                        <!-- JavaScript দিয়ে ডাটা রেন্ডার হবে -->
                    </tbody>
                </table>
            </div>
        </div>

    </main>

    <!-- Footer Attribution -->
    <footer class="text-center p-6 text-gray-500 text-xs md:text-sm mt-8 border-t border-gray-200 bg-white">
        <p>&copy; 2026 Vehicles Contract 2.0 | Developed by <span class="font-bold text-indigo-600">Md. Amirul Islam</span></p>
    </footer>

    <!-- Scripts -->
    <script>
        // ডেমো ডাটা (আপনার অরিজিনাল ডাটা দিয়ে রিপ্লেস করবেন)
        let driversData = [
            { name: "Abdur Rahim", category: "Heavy", phone: "01711000000", vehicle: "Dhaka Metro-Ta 11-2233 (Truck)", status: "Active" },
            { name: "Karim Mia", category: "Light", phone: "01911000000", vehicle: "Dhaka Metro-Ga 22-4455 (Pickup)", status: "On Trip" },
            { name: "Sajedul Islam", category: "Heavy", phone: "01811000000", vehicle: "Chatto Metro-Ta 14-5566 (Covered Van)", status: "Maintenance" }
        ];

        // ক্যাটাগরি অনুযায়ী ব্যাজ কালার জেনারেট
        function getCategoryBadgeClass(category) {
            if(category === 'Heavy') return 'bg-red-100 text-red-700 border-red-200';
            if(category === 'Light') return 'bg-blue-100 text-blue-700 border-blue-200';
            return 'bg-gray-100 text-gray-700 border-gray-200';
        }

        // টেবিল রেন্ডার ফাংশন (ওয়ার্ড র‍্যাপ ও ওভারফ্লো ফিক্স সহ)
        function renderDriversTable(data) {
            const tbody = document.getElementById('tableBody');
            
            if(data.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" class="p-6 text-center text-gray-500 font-medium">No contracts found.</td></tr>`;
                return;
            }

            tbody.innerHTML = data.map(d => `
                <tr class="hover:bg-slate-50 transition-colors">
                    <td class="p-4 pl-6 font-bold text-slate-900 flex items-center gap-3 min-w-[180px]">
                        <div class="w-9 h-9 rounded-full bg-indigo-100 text-indigo-700 flex items-center justify-center font-extrabold text-sm shrink-0 shadow-inner">${d.name.charAt(0)}</div>
                        <span class="break-words">${d.name}</span>
                    </td>
                    <td class="p-4">
                        <span class="inline-block w-20 text-center py-1 text-xs font-bold rounded-md border leading-tight ${getCategoryBadgeClass(d.category)}">${d.category || 'N/A'}</span>
                    </td>
                    <td class="p-4 min-w-[150px]">
                        <div class="flex items-center gap-2 flex-wrap">
                            <span class="font-mono font-bold text-slate-800 tracking-wide break-all">${d.phone}</span>
                            <a href="tel:${d.phone.replace(/[^0-9+]/g, '')}" 
                               title="Call ${d.name}"
                               class="bg-emerald-500 hover:bg-emerald-600 text-white px-2 py-1 rounded text-xs font-bold transition-all flex items-center gap-1 shadow-sm shrink-0">
                                <i class="fa-solid fa-phone text-[10px]"></i> Call
                            </a>
                        </div>
                    </td>
                    <td class="p-4 text-slate-700 font-medium break-words min-w-[180px] max-w-[220px]">
                        ${d.vehicle ? d.vehicle : '<span class="text-slate-400 font-normal">—</span>'}
                    </td>
                    <td class="p-4 pr-6 min-w-[120px]">
                        <span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-bold bg-emerald-100 text-emerald-800 shrink-0 border border-emerald-200">
                            <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 shadow-sm"></span>${d.status}
                        </span>
                    </td>
                </tr>
            `).join('');
        }

        // লাইভ সার্চ ফিল্টার
        document.getElementById('searchInput').addEventListener('input', (e) => {
            const term = e.target.value.toLowerCase();
            const filtered = driversData.filter(d => 
                d.name.toLowerCase().includes(term) || 
                d.phone.includes(term) || 
                (d.vehicle && d.vehicle.toLowerCase().includes(term))
            );
            renderDriversTable(filtered);
        });

        // এডমিন লগিন পপ-আপ
        function adminLogin() {
            const pass = prompt("Enter Admin Password:");
            if(pass) {
                // আপনার এডমিন অথেন্টিকেশন লজিক এখানে বসাবেন
                if(pass === "admin123") {
                    alert("Access Granted!");
                } else {
                    alert("Incorrect Password!");
                }
            }
        }

        // প্রথমে একবার টেবিল রেন্ডার করা
        window.addEventListener('DOMContentLoaded', () => {
            renderDriversTable(driversData);
        });
    </script>
</body>
</html>
